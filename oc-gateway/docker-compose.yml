services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GATEWAY_DATA: /data
      GATEWAY_CONFIG: /app/config/providers.yaml
    volumes:
      - gateway-data:/data
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8080:8080"        # loopback only (reach the dashboard through an SSH tunnel); Caddy talks to it over the compose network
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gateway]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  gateway-data:
  caddy-data:
  caddy-config:
# No PostgreSQL / Redis on purpose: one gateway instance, SQLite (WAL + scheduled backups) is enough and removes two
# components to secure and update. Add them only if you later run several gateway instances.
